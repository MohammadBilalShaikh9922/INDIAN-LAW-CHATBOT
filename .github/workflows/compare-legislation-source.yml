
name: Compare Legislation With Official Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-source:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python -m pip install pypdf

      - name: Generate preliminary comparison report
        run: python indian-law-chatbot/backend/app/compare_legislation_source.py

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: nyayaai-legislation-comparison-report
          path: indian-law-chatbot/backend/app/legislation_source_comparison_report.md
          if-no-files-found: error
