name: Verify Legislation Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - "indian-law-chatbot/backend/app/data/central_acts.json"
      - "indian-law-chatbot/backend/app/verify_legislation_dataset.py"
      - ".github/workflows/verify-legislation.yml"

jobs:
  verify-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run structural verification
        run: python indian-law-chatbot/backend/app/verify_legislation_dataset.py
